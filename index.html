<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f5">
  <title>A Little Red Letter</title>
  <meta name="description" content="Open a realistic red envelope and reveal a blank sheet of paper.">
  <style>
    :root {
      color-scheme: light;
      --blush: #fff7f5;
      --ink: #241819;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--blush); }
    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 35%, #fffdfc 0%, var(--blush) 73%);
      color: var(--ink);
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 1080px);
      min-height: 100svh;
      margin-inline: auto;
      padding: clamp(12px, 3vw, 30px) 14px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .envelope-control {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      width: 100%;
      max-width: 1020px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 12px;
      position: relative;
      background: transparent;
      color: inherit;
      cursor: pointer;
      perspective: 1400px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      outline: none;
    }
    .envelope-control:focus-visible {
      outline: 3px solid rgba(192, 6, 3, .65);
      outline-offset: 4px;
    }
    #envelope-art {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      transform: translateY(0);
      transition: transform 650ms cubic-bezier(.22, 1, .36, 1);
    }
    .envelope-control:hover #envelope-art { transform: translateY(-2px); }
    .envelope-control.is-open:hover #envelope-art { transform: translateY(-1px); }
    .letter-clip { clip-path: url(#letter-clip); }
    .letter-paper {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: translateY(520px) rotate(-.35deg) scale(.985);
      transition: transform 1050ms cubic-bezier(.22, 1, .36, 1);
      will-change: transform;
    }
    .letter-shadow { opacity: .22; transition: opacity 520ms ease 100ms; }
    .back-flap,
    .closed-flap {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      transform: rotateX(0deg);
      backface-visibility: hidden;
    }
    .back-flap {
      opacity: 0;
      transition: transform 820ms cubic-bezier(.22, 1, .36, 1), opacity 260ms ease 60ms;
    }
    .closed-flap {
      opacity: 1;
      transition: transform 820ms cubic-bezier(.22, 1, .36, 1), opacity 220ms ease 80ms;
    }
    .envelope-control.is-open .letter-paper {
      transform: translateY(-250px) rotate(0deg) scale(1);
      transition-delay: 130ms;
    }
    /* During fullscreen close, the real paper travels to a higher position
       behind the overlay. After the overlay arrives, it settles back down. */
    .envelope-control.is-open.is-returning .letter-paper {
      transform: translateY(-450px) rotate(0deg) scale(1);
      transition: transform 790ms cubic-bezier(.22, 1, .36, 1);
      transition-delay: 0ms;
    }
    .envelope-control.is-open .letter-shadow { opacity: .36; }
    .envelope-control.is-open .back-flap {
      opacity: 1;
      transform: rotateX(180deg);
      transition: transform 820ms cubic-bezier(.22, 1, .36, 1), opacity 260ms ease 50ms;
    }
    .envelope-control.is-open .closed-flap {
      opacity: 0;
      transform: rotateX(180deg);
      transition: transform 820ms cubic-bezier(.22, 1, .36, 1), opacity 220ms ease 80ms;
      pointer-events: none;
    }
    /* The blank sheet expands into a distraction-free, full-screen page. */
    .paper-fullscreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      overflow: hidden;
      background: transparent;
      pointer-events: auto;
      touch-action: manipulation;
      isolation: isolate;
    }
    /* Keep the white canvas on its own composited layer. Fading opacity avoids
       repainting a full-screen background color on every animation frame. */
    .paper-fullscreen-backdrop {
      position: absolute;
      z-index: 0;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      transition: opacity 820ms cubic-bezier(.22, 1, .36, 1);
      will-change: opacity;
      pointer-events: none;
    }
    .paper-fullscreen.is-fullscreen .paper-fullscreen-backdrop {
      opacity: 1;
      transition: opacity 600ms cubic-bezier(.22, 1, .36, 1);
    }
    .paper-fullscreen.is-closing .paper-fullscreen-backdrop { opacity: 0; }

    /* One real sheet, with a stable white surface in both envelope and editor states. */
    #paper stop { stop-color: #ffffff; transition: none; }
    #paper-surface { filter: none !important; transition: stroke-opacity 400ms ease; }
    .paper-edge-highlight { transition: stroke-opacity 400ms ease; }
    .letter-paper.is-in-fullscreen .letter-shadow {
      opacity: .36;
      transition: opacity 400ms ease;
    }
    body.paper-is-white #paper stop {
      stop-color: #ffffff;
      transition: none;
    }
    body.paper-is-white #paper-surface {
      stroke-opacity: 0;
      transition: stroke-opacity 400ms ease 350ms;
    }
    body.paper-is-white .paper-edge-highlight {
      stroke-opacity: 0;
      transition: stroke-opacity 400ms ease 350ms;
    }
    body.paper-is-white .letter-paper.is-in-fullscreen .letter-shadow {
      opacity: 0;
      transition: opacity 400ms ease 350ms;
    }
    .fullscreen-art {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      touch-action: manipulation;
    }
    .letter-paper.is-in-fullscreen .paper-edge-highlight { display: none; }
    /* This is the actual SVG paper group moved out of the envelope, not a clone. */
    .letter-paper.is-in-fullscreen {
      transform-box: view-box !important;
      transform-origin: 0 0 !important;
      transition: transform 820ms cubic-bezier(.22, 1, .36, 1);
      cursor: default;
      pointer-events: auto;
      will-change: transform;
    }
    .envelope-control.is-open.is-returning .letter-paper {
      transform: translateY(-450px) rotate(0deg) scale(1);
      transition: none !important;
      transition-delay: 0ms !important;
    }
    .envelope-control.is-open.is-settling .letter-paper {
      transform: translateY(-250px) rotate(0deg) scale(1);
      transition: transform 920ms cubic-bezier(.22, 1, .36, 1) !important;
      transition-delay: 0ms !important;
    }
    /* 44px control targets are easier to hit on touchscreens. */
    .paper-fullscreen-close {
      position: fixed;
      z-index: 2147483647;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      display: none;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(60, 60, 67, .16);
      border-radius: 50%;
      background: rgba(255, 255, 255, .92);
      color: #242326;
      box-shadow: 0 2px 8px rgba(24, 22, 22, .08), 0 8px 24px rgba(24, 22, 22, .05);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      backdrop-filter: saturate(180%) blur(18px);
      cursor: pointer;
      opacity: 0;
      transform: scale(.96);
      visibility: hidden;
      pointer-events: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 180ms ease, transform 200ms cubic-bezier(.2, .8, .2, 1), visibility 0s 200ms, background-color 160ms ease, box-shadow 160ms ease;
    }
    .paper-fullscreen-close.is-visible {
      opacity: 1;
      transform: scale(1);
      visibility: visible;
      pointer-events: auto;
      transition: opacity 180ms ease, transform 200ms cubic-bezier(.2, .8, .2, 1), visibility 0s, background-color 160ms ease, box-shadow 160ms ease;
    }
    /* Keep the control outside the fullscreen SVG stacking context. */
    body.is-paper-fullscreen .paper-fullscreen-close {
      display: grid !important;
    }
    .paper-fullscreen-close svg {
      display: block;
      width: 16px;
      height: 16px;
    }
    .paper-fullscreen-close:hover {
      background: rgba(255, 255, 255, .99);
      box-shadow: 0 3px 10px rgba(24, 22, 22, .09), 0 10px 28px rgba(24, 22, 22, .06);
    }
    .paper-fullscreen-close:active {
      background: rgba(242, 241, 243, .98);
      box-shadow: 0 1px 3px rgba(24, 22, 22, .08);
      transform: scale(.94);
    }
    .paper-fullscreen-close:focus-visible {
      outline: 2px solid #9a332e;
      outline-offset: 3px;
    }
    .letter-paper { cursor: default; }
    /* Quiet, native-feeling floating control: crisp edge, restrained shadow, clear hit target. */
    /* Keep the primary control and its menu aligned as one compact toolbar. */
    .paper-fullscreen-edit {
      position: fixed;
      z-index: 2147483647;
      top: max(16px, env(safe-area-inset-top));
      right: calc(max(16px, env(safe-area-inset-right)) + 52px);
      min-width: 88px;
      height: 44px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid rgba(60, 60, 67, .14);
      border-radius: 22px;
      background: rgba(255, 255, 255, .92);
      color: #242326;
      box-shadow: 0 2px 8px rgba(24, 22, 22, .08), 0 8px 24px rgba(24, 22, 22, .05);
      -webkit-backdrop-filter: saturate(180%) blur(18px);
      backdrop-filter: saturate(180%) blur(18px);
      font: 550 14px/1 ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -.01em;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      -webkit-tap-highlight-color: transparent;
      transform: translateY(-3px) scale(.98);
      transition: opacity 180ms ease, transform 200ms cubic-bezier(.2, .8, .2, 1), visibility 0s 200ms, background-color 160ms ease, box-shadow 160ms ease;
    }
    body.is-paper-fullscreen .paper-fullscreen-edit {
      display: flex !important;
    }
    .paper-fullscreen-edit.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition: opacity 180ms ease, transform 200ms cubic-bezier(.2, .8, .2, 1), visibility 0s, background-color 160ms ease, box-shadow 160ms ease;
    }
    .paper-fullscreen-edit svg {
      display: block;
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }
    .paper-fullscreen-edit:hover {
      background: rgba(255, 255, 255, .99);
      box-shadow: 0 3px 10px rgba(24, 22, 22, .09), 0 10px 28px rgba(24, 22, 22, .06);
    }
    .paper-fullscreen-edit:active {
      background: rgba(242, 241, 243, .98);
      box-shadow: 0 1px 3px rgba(24, 22, 22, .08);
      transform: scale(.97);
    }
    .paper-fullscreen-edit:focus-visible {
      outline: 2px solid #9a332e;
      outline-offset: 3px;
    }
    /* Menu item is larger, left-aligned, and anchored to the Edit control. */
    .paper-fullscreen-text {
      position: fixed;
      z-index: 2147483647;
      top: calc(max(16px, env(safe-area-inset-top)) + 52px);
      right: calc(max(16px, env(safe-area-inset-right)) + 52px);
      width: 160px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 0 15px;
      border: 1px solid rgba(60, 60, 67, .12);
      border-radius: 14px;
      background: rgba(255, 255, 255, .96);
      color: #242326;
      box-shadow: 0 4px 14px rgba(24, 22, 22, .08), 0 14px 36px rgba(24, 22, 22, .09);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      font: 550 15px/1 ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -.01em;
      text-align: left;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-5px) scale(.98);
      transform-origin: top right;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 160ms ease, transform 200ms cubic-bezier(.2, .8, .2, 1), visibility 0s 200ms, background-color 160ms ease, box-shadow 160ms ease;
    }
    .paper-fullscreen-text svg {
      display: block;
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: #6b6666;
    }
    .paper-fullscreen-text.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition: opacity 160ms ease, transform 200ms cubic-bezier(.2, .8, .2, 1), visibility 0s, background-color 160ms ease, box-shadow 160ms ease;
    }
    .paper-fullscreen-text:hover {
      background: rgba(255, 255, 255, .99);
      box-shadow: 0 5px 14px rgba(24, 22, 22, .09), 0 14px 36px rgba(24, 22, 22, .1);
    }
    .paper-fullscreen-text:active {
      background: rgba(242, 241, 243, .98);
      box-shadow: 0 1px 3px rgba(24, 22, 22, .08);
      transform: scale(.985);
    }
    .paper-fullscreen-text:focus-visible {
      outline: 2px solid #9a332e;
      outline-offset: 3px;
    }
    /* The text editor is aligned to the real paper rectangle, not the viewport. */
    .envelope-control.is-open .letter-paper {
      cursor: zoom-in;
      pointer-events: auto;
    }
    @media (max-width: 560px) {
      main { padding: 8px 4px 16px; }
      .envelope-control { width: 100%; }
    }
    @media (max-height: 560px) and (orientation: landscape) {
      main { justify-content: flex-start; padding-top: 0; }
      .envelope-control { max-width: min(94vw, 78vh * 1.5); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>

</head>
<body>
  <main>
    <button class="envelope-control" id="letter-control" type="button" aria-expanded="false" aria-label="Open the red envelope by lifting its flap">
      <svg id="envelope-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="art-title art-desc">
        <title id="art-title">A realistic red envelope with blank paper</title>
        <desc id="art-desc">A deep red envelope. Tap its top flap to open it and reveal a blank sheet of paper.</desc>
        <defs>
          <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#bc0603"/><stop offset=".16" stop-color="#df0b08"/><stop offset=".5" stop-color="#d60705"/><stop offset=".84" stop-color="#e20b08"/><stop offset="1" stop-color="#b80503"/>
          </linearGradient>
          <linearGradient id="body-light" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f20f0a"/><stop offset=".52" stop-color="#d60805"/><stop offset="1" stop-color="#bd0603"/>
          </linearGradient>
          <linearGradient id="left-fold" x1="0" y1="0" x2="1" y2=".1">
            <stop offset="0" stop-color="#b80603"/><stop offset=".65" stop-color="#dc0906"/><stop offset="1" stop-color="#ef1610"/>
          </linearGradient>
          <linearGradient id="right-fold" x1="1" y1="0" x2="0" y2=".1">
            <stop offset="0" stop-color="#b80503"/><stop offset=".65" stop-color="#d80805"/><stop offset="1" stop-color="#ef1610"/>
          </linearGradient>
          <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f0140d"/><stop offset=".45" stop-color="#df0a06"/><stop offset="1" stop-color="#c00703"/>
          </linearGradient>
          <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f20d09"/><stop offset=".24" stop-color="#ed0b08"/><stop offset=".7" stop-color="#df0805"/><stop offset="1" stop-color="#ca0603"/>
          </linearGradient>
          <linearGradient id="flap-inside" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a90000"/><stop offset=".5" stop-color="#cf0503"/><stop offset="1" stop-color="#ee1710"/>
          </linearGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#990000" stop-opacity=".75"/><stop offset=".07" stop-color="#ff342c" stop-opacity=".45"/><stop offset=".5" stop-color="#ff342c" stop-opacity=".12"/><stop offset=".94" stop-color="#ff342c" stop-opacity=".4"/><stop offset="1" stop-color="#7e0000" stop-opacity=".8"/>
          </linearGradient>
          <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fffdfa"/><stop offset=".58" stop-color="#fffaf5"/><stop offset="1" stop-color="#f3e8e2"/>
          </linearGradient>
          <filter id="ground-shadow" x="-20%" y="-80%" width="140%" height="260%">
            <feGaussianBlur stdDeviation="12"/>
          </filter>
          <filter id="envelope-shadow" x="-12%" y="-12%" width="124%" height="132%">
            <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#270805" flood-opacity=".24"/>
          </filter>
          <filter id="flap-shadow" x="-10%" y="-12%" width="120%" height="130%">
            <feDropShadow dx="0" dy="6" stdDeviation="5.5" flood-color="#230402" flood-opacity=".32"/>
          </filter>
          <filter id="paper-shadow" x="-12%" y="-12%" width="124%" height="132%">
            <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4b0a08" flood-opacity=".23"/>
          </filter>
          <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="13" result="n"/>
            <feColorMatrix in="n" type="saturate" values="0" result="g"/>
            <feComponentTransfer in="g" result="a"><feFuncA type="table" tableValues=".015 .1"/></feComponentTransfer>
            <feBlend in="SourceGraphic" in2="a" mode="soft-light"/>
          </filter>
          <path id="envelope-shape" d="M207 162.5H1329.5Q1340.5 162.5 1340.5 174V869Q1340.5 881 1328.5 881H207.5Q195 881 195 868.5V175Q195 162.5 207 162.5Z"/>
          <path id="flap-shape" d="M198 163H1335.5C1331 199 1318 231 1291 253L815 649C798 663 780 663 762 650L238 251C215 232 204 198 198 163Z"/>
          <clipPath id="envelope-clip"><use href="#envelope-shape"/></clipPath>
          <!-- Keep the sheet inside the envelope at the bottom during its slide,
               while allowing it to emerge above the back edge as it opens. -->
          <clipPath id="letter-clip">
            <!-- Extend above the envelope far enough to keep the full sheet visible
                 during the raised return position. -->
            <path d="M207 -650H1329.5Q1340.5 -650 1340.5 -638V869Q1340.5 881 1328.5 881H207.5Q195 881 195 868.5V-638Q195 -650 207 -650Z"/>
          </clipPath>
        </defs>

        <ellipse cx="768" cy="902" rx="452" ry="22" fill="#54110f" opacity=".15" filter="url(#ground-shadow)"/>

        <g class="envelope-shell" filter="url(#envelope-shadow)">
          <use href="#envelope-shape" fill="url(#body)"/>
          <use href="#envelope-shape" fill="url(#body-light)" opacity=".5"/>
          <use href="#envelope-shape" fill="none" stroke="#8f0000" stroke-opacity=".32" stroke-width="2"/>
        </g>

        <g class="back-flap">
          <use href="#flap-shape" fill="url(#flap-inside)" stroke="#940000" stroke-width="2.5"/>
          <path d="M239 252L762 650Q781 665 800 650L1291 253" fill="none" stroke="#ff4035" stroke-opacity=".32" stroke-width="3"/>
        </g>

        <g class="letter-clip" clip-path="url(#letter-clip)">
          <g class="letter-paper" id="letter-paper">
            <rect class="letter-shadow" x="365" y="90" width="803" height="690" rx="13" fill="#3b0808" filter="url(#paper-shadow)"/>
            <rect id="paper-surface" x="365" y="90" width="803" height="690" rx="13" fill="url(#paper)" stroke="#d8c8c1" stroke-width="2" filter="url(#grain)"/>
            <foreignObject id="paper-editor-foreign" x="365" y="90" width="803" height="690" overflow="hidden">
              <div xmlns="http://www.w3.org/1999/xhtml" id="paper-page-viewport" class="ls-canvas-layer" aria-label="Editable page viewport">
                <div id="paper-page-content" class="ls-site-page" aria-label="Website page canvas"></div>
              </div>
            </foreignObject>
            <path class="paper-edge-highlight" d="M378 104H1155" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2"/>
          </g>
        </g>

        <g class="front-folds" clip-path="url(#envelope-clip)" filter="url(#grain)">
          <path d="M195 163L570 514L195 881Z" fill="url(#left-fold)"/>
          <path d="M1341 163L972 514L1341 881Z" fill="url(#right-fold)"/>
          <path d="M195 881L570 514L767 656Q783 667 800 656L972 514L1341 881Z" fill="url(#bottom)"/>
          <path d="M196 880L570 514L767 655Q783 666 800 655L972 514L1340 880" fill="none" stroke="#870000" stroke-opacity=".48" stroke-width="3"/>
          <path d="M202 870L570 521L765 659Q783 672 802 659L972 521L1334 870" fill="none" stroke="#ff2921" stroke-opacity=".2" stroke-width="2"/>
        </g>

        <g class="closed-flap">
          <use href="#flap-shape" fill="#2a0503" opacity=".3" transform="translate(0 4)" filter="url(#flap-shadow)"/>
          <use href="#flap-shape" fill="url(#flap)" filter="url(#grain)"/>
          <path d="M199 164H1334.5C1329 198 1317 230 1290 252L814 647C798 660 781 661 763 648L239 250C216 231 205 198 199 164Z" fill="none" stroke="url(#rim)" stroke-width="2.2"/>
          <path d="M200 164H1333" fill="none" stroke="#ff4940" stroke-opacity=".42" stroke-width="2"/>
          <path d="M202 167C207 199 216 226 240 248L761 647Q782 666 801 652L1291 252C1317 229 1329 200 1333 167" fill="none" stroke="#a50000" stroke-opacity=".44" stroke-width="3"/>
        </g>
      </svg>
    </button>
    </main>
  <div class="paper-fullscreen" id="paper-fullscreen" aria-hidden="true">
    <div class="paper-fullscreen-backdrop" aria-hidden="true"></div>
    <svg class="fullscreen-art" id="fullscreen-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="none" aria-label="The same blank letter paper expanded to full screen"></svg>
  </div>
  <button class="paper-fullscreen-edit" id="paper-fullscreen-edit" type="button" aria-label="Edit options" aria-expanded="false" aria-controls="paper-fullscreen-text" title="Edit options">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
      <path d="M11.9 4.1 15.9 8.1M3.4 16.6l3.9-.8L16.1 7a1.7 1.7 0 0 0-2.4-2.4L4.9 13.4l-1.5 3.2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span id="paper-fullscreen-edit-label">Edit</span>
  </button>
  <button class="paper-fullscreen-text" id="paper-fullscreen-text" type="button" aria-label="Text option" title="Text option">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
      <path d="M4.5 6.5h15M12 6.5v11M8.5 17.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Text</span>
  </button>
  <button class="paper-fullscreen-close" id="paper-fullscreen-close" type="button" aria-label="Return to the envelope" title="Back to envelope">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
      <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </svg>
  </button>
  <script>
    (() => {
      const control = document.getElementById('letter-control');
      const art = document.getElementById('envelope-art');

      const artDesc = document.getElementById('art-desc');

      function pointIsOnFlap(event) {
        const matrix = art.getScreenCTM();
        if (!matrix) return false;
        const point = art.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        const p = point.matrixTransform(matrix.inverse());
        const t = (p.y - 163) / (649 - 163);
        if (t < 0 || t > 1) return false;
        const left = 198 + (815 - 198) * t;
        const right = 1335.5 + (781 - 1335.5) * t;
        return p.x >= left && p.x <= right;
      }

      const paperSurface = document.getElementById('paper-surface');
      const letterPaper = document.getElementById('letter-paper');
      const letterShadow = letterPaper.querySelector('.letter-shadow');
      const originalPaperFill = paperSurface.getAttribute('fill');
      const originalPaperFilter = paperSurface.getAttribute('filter');
      const originalPaperStroke = paperSurface.getAttribute('stroke');
      const originalPaperHeight = paperSurface.getAttribute('height');
      const originalShadowHeight = letterShadow.getAttribute('height');
      const originalShadowFilter = letterShadow.getAttribute('filter');
      const paperFullscreen = document.getElementById('paper-fullscreen');
      const fullscreenArt = document.getElementById('fullscreen-art');
      const fullscreenClose = document.getElementById('paper-fullscreen-close');
      const fullscreenEdit = document.getElementById('paper-fullscreen-edit');
      const fullscreenText = document.getElementById('paper-fullscreen-text');
      let isPaperFullscreen = false;
      let fullscreenAnimating = false;
      let previousBodyOverflow = "";
      let paperHomeParent = null;
      let paperHomeNextSibling = null;
      let normalPaperRect = null;
      let raisedPaperRect = null;
      let paperLocalBox = null;
      let activePaperAnimation = null;
      const paperMotionEasing = 'cubic-bezier(.22, 1, .36, 1)';

      function updateFullscreenViewBox() {
        const w = window.innerWidth || document.documentElement.clientWidth;
        const h = window.innerHeight || document.documentElement.clientHeight;
        fullscreenArt.setAttribute('viewBox', `0 0 ${w} ${h}`);
      }

      // The editing canvas is a responsive viewport, not a fixed-ratio sheet.
      // Fill the available device viewport so the paper and its editable content
      // can adapt to portrait phones, landscape phones, tablets, and desktops.
      function getContainedFullscreenRect() {
        const w = window.innerWidth || document.documentElement.clientWidth;
        const h = window.innerHeight || document.documentElement.clientHeight;
        return { left: 0, top: 0, width: w, height: h };
      }

      // The normal and raised positions are measured from the real SVG paper
      // while it is still inside the envelope. Do not estimate CSS transform
      // distances from the SVG viewBox scale; that can diverge from the browser's
      // rendered position on different viewport sizes.
      function preparePaperResourcesForFullscreen() {
        // The real paper becomes a completely blank white canvas while fullscreen:
        // no grain, border, highlight, shadow, text, or photo elements. Removing SVG
        // filters also avoids expensive filter rendering during transforms on mobile.
        fullscreenArt.replaceChildren();
        document.body.classList.add('paper-is-white');
        paperSurface.setAttribute('filter', 'none');
        letterShadow.setAttribute('filter', 'none');
      }

      function restorePaperResourcesToEnvelope() {
        document.body.classList.remove('paper-is-white');
        paperSurface.setAttribute('fill', originalPaperFill);
        paperSurface.setAttribute('filter', originalPaperFilter);
        paperSurface.setAttribute('stroke', originalPaperStroke);
        paperSurface.removeAttribute('stroke-opacity');
        letterShadow.setAttribute('filter', originalShadowFilter);
        letterShadow.style.opacity = '';
        // The original SVG definitions remain in the envelope's parent SVG.
        fullscreenArt.replaceChildren();
        paperFullscreen.classList.remove('is-fullscreen', 'is-closing');
      }

      function matrixForRect(rect, box) {
        const sx = rect.width / box.width;
        const sy = rect.height / box.height;
        const tx = rect.left - box.x * sx;
        const ty = rect.top - box.y * sy;
        return `matrix(${sx}, 0, 0, ${sy}, ${tx}, ${ty})`;
      }

      function setPaperTransformForRect(rect) {
        letterPaper.style.transform = matrixForRect(rect, paperLocalBox);
      }

      // Animate explicit screen-space transforms with the Web Animations API.
      // This avoids depending on a CSS transition restarting after the SVG group
      // is reparented from one SVG element into another.
      function animatePaperBetweenRects(fromRect, toRect, duration = 820) {
        const fromTransform = matrixForRect(fromRect, paperLocalBox);
        const toTransform = matrixForRect(toRect, paperLocalBox);
        const reduceMotion = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const actualDuration = reduceMotion ? 1 : duration;

        letterPaper.style.transition = 'none';
        letterPaper.style.transform = fromTransform;
        // Commit the starting frame before starting the animation.
        letterPaper.getBoundingClientRect();

        if (typeof letterPaper.animate === 'function') {
          const animation = letterPaper.animate(
            [{ transform: fromTransform }, { transform: toTransform }],
            {
              duration: actualDuration,
              easing: paperMotionEasing,
              fill: 'forwards'
            }
          );
          activePaperAnimation = animation;
          const finished = animation.finished.then(() => {
            if (activePaperAnimation !== animation) return;
            // Persist the final transform before removing the animation effect.
            letterPaper.style.transform = toTransform;
            animation.cancel();
            activePaperAnimation = null;
          }).catch(() => {
            // Cancellation is expected when a user closes during opening.
          });
          return { animation, targetTransform: toTransform, finished };
        }

        // Compatibility fallback for browsers without the Web Animations API.
        letterPaper.style.transition = `transform ${actualDuration}ms ${paperMotionEasing}`;
        const finished = new Promise(resolve => {
          let completed = false;
          const finish = () => {
            if (completed) return;
            completed = true;
            letterPaper.removeEventListener('transitionend', onTransitionEnd);
            window.clearTimeout(fallbackTimer);
            resolve();
          };
          const onTransitionEnd = event => {
            if (event.target === letterPaper && event.propertyName === 'transform') finish();
          };
          letterPaper.addEventListener('transitionend', onTransitionEnd);
          const fallbackTimer = window.setTimeout(finish, actualDuration + 100);
          requestAnimationFrame(() => {
            letterPaper.style.transform = toTransform;
          });
        });
        return { animation: null, targetTransform: toTransform, finished };
      }

      function restorePaperToEnvelope() {
        if (!paperHomeParent) return;
        // Restore the original stationery dimensions after the page return animation.
        paperSurface.setAttribute('height', originalPaperHeight);
        letterShadow.setAttribute('height', originalShadowHeight);
        letterPaper.classList.remove('is-in-fullscreen');
        letterPaper.style.transition = 'none';
        letterPaper.style.transform = '';
        letterPaper.style.transformBox = '';
        letterPaper.style.transformOrigin = '';
        if (paperHomeNextSibling && paperHomeNextSibling.parentNode === paperHomeParent) {
          paperHomeParent.insertBefore(letterPaper, paperHomeNextSibling);
        } else {
          paperHomeParent.appendChild(letterPaper);
        }
        restorePaperResourcesToEnvelope();
      }

      function openPaperFullscreen() {
        if (!control.classList.contains('is-open') || isPaperFullscreen || fullscreenAnimating) return;
        fullscreenAnimating = true;

        // Capture the exact current screen position before moving this same SVG group.
        const currentPaperRect = paperSurface.getBoundingClientRect();
        paperLocalBox = letterPaper.getBBox();
        if (!currentPaperRect.width || !currentPaperRect.height || !paperLocalBox.width || !paperLocalBox.height) {
          fullscreenAnimating = false;
          return;
        }

        // Measure both envelope positions from the actual paper group. This
        // avoids estimating its raised screen position from SVG scale math.
        // Transitions are disabled only for these synchronous measurements.
        const previousInlineTransform = letterPaper.style.transform;
        const previousInlineTransition = letterPaper.style.transition;
        const wasReturning = control.classList.contains('is-returning');
        const wasSettling = control.classList.contains('is-settling');
        letterPaper.style.transition = 'none';
        letterPaper.style.transform = '';
        control.classList.remove('is-returning', 'is-settling');
        normalPaperRect = letterPaper.getBoundingClientRect();
        control.classList.add('is-returning');
        raisedPaperRect = letterPaper.getBoundingClientRect();
        control.classList.toggle('is-returning', wasReturning);
        control.classList.toggle('is-settling', wasSettling);
        letterPaper.style.transform = previousInlineTransform;
        letterPaper.style.transition = previousInlineTransition;
        letterPaper.getBoundingClientRect();

        if (!normalPaperRect.width || !normalPaperRect.height ||
            !raisedPaperRect.width || !raisedPaperRect.height) {
          fullscreenAnimating = false;
          return;
        }

        paperHomeParent = letterPaper.parentNode;
        paperHomeNextSibling = letterPaper.nextSibling;
        isPaperFullscreen = true;
        previousBodyOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        updateFullscreenViewBox();
        paperFullscreen.classList.remove('is-fullscreen', 'is-closing');
        paperFullscreen.style.display = 'block';
        paperFullscreen.setAttribute('aria-hidden', 'false');
        document.body.classList.add('is-paper-fullscreen');
        fullscreenClose.style.display = 'grid';
        fullscreenClose.classList.add('is-visible');
        fullscreenEdit.classList.add('is-visible');
        fullscreenText.classList.remove('is-visible');
        fullscreenEdit.setAttribute('aria-expanded', 'false');

        // Reparent the original paper node. The explicit animation below guarantees
        // a visible transition from its current envelope position to fullscreen.
        preparePaperResourcesForFullscreen();
        letterPaper.classList.add('is-in-fullscreen');
        fullscreenArt.appendChild(letterPaper);

        const fullscreenTargetRect = getContainedFullscreenRect();
        animatePaperBetweenRects(currentPaperRect, fullscreenTargetRect, 820);
        paperFullscreen.classList.add('is-fullscreen');

        // Permit close immediately; the animation itself continues independently.
        fullscreenAnimating = false;
        fullscreenClose.focus({ preventScroll: true });
      }

      function closePaperFullscreen() {
        if (!isPaperFullscreen || fullscreenAnimating || !normalPaperRect || !paperLocalBox) return;
        fullscreenAnimating = true;
        fullscreenClose.classList.remove('is-visible');
        fullscreenEdit.classList.remove('is-visible');
        fullscreenText.classList.remove('is-visible');
        fullscreenEdit.setAttribute('aria-expanded', 'false');

        // Preserve the original close motion: travel up to the envelope's raised
        // position, then settle down into the open envelope. These rectangles must
        // describe the whole SVG paper group, matching paperLocalBox below.
        const currentPaperRect = letterPaper.getBoundingClientRect();
        const targetPaperRect = raisedPaperRect || normalPaperRect;
        if (activePaperAnimation) {
          activePaperAnimation.cancel();
          activePaperAnimation = null;
        }

        paperFullscreen.classList.add('is-closing');
        const closingMotion = animatePaperBetweenRects(currentPaperRect, targetPaperRect, 820);

        closingMotion.finished.then(() => {
          if (!isPaperFullscreen || !fullscreenAnimating) return;

          // The first, screen-space close animation has reached the measured raised
          // position. Persist it, then restore the same SVG paper to its original
          // parent before the downward settle so the red front folds stay in front.
          letterPaper.style.transform = closingMotion.targetTransform;
          if (closingMotion.animation && activePaperAnimation === closingMotion.animation) {
            closingMotion.animation.cancel();
            activePaperAnimation = null;
          }

          paperFullscreen.classList.remove('is-fullscreen', 'is-closing');
          paperFullscreen.style.display = 'none';
          paperFullscreen.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('is-paper-fullscreen');
          fullscreenClose.style.display = '';
          fullscreenClose.classList.remove('is-visible');
          fullscreenEdit.classList.remove('is-visible');

          // These existing CSS states are measured from the real envelope on open:
          // -returning is the raised start; -settling is the lower resting position.
          // Use a native SVG CSS transition instead of WAAPI here: Chromium can hang
          // when WAAPI animates this SVG group after it contains a foreignObject.
          control.classList.add('is-returning');
          restorePaperToEnvelope();
          letterPaper.getBoundingClientRect(); // Commit the raised starting frame.

          isPaperFullscreen = false;
          document.body.style.overflow = previousBodyOverflow;

          let finalized = false;
          const finishSettle = () => {
            if (finalized) return;
            finalized = true;
            control.classList.remove('is-returning', 'is-settling');
            letterPaper.style.transition = '';
            letterPaper.style.transform = '';
            letterPaper.style.transformBox = '';
            letterPaper.style.transformOrigin = '';
            letterPaper.getBoundingClientRect();
            fullscreenAnimating = false;
          };
          const onSettleEnd = event => {
            if (event.target === letterPaper && event.propertyName === 'transform') {
              letterPaper.removeEventListener('transitionend', onSettleEnd);
              finishSettle();
            }
          };
          letterPaper.addEventListener('transitionend', onSettleEnd);

          requestAnimationFrame(() => {
            control.classList.remove('is-returning');
            control.classList.add('is-settling');
            letterPaper.getBoundingClientRect(); // Start the native CSS transition.
          });
          // iOS/mobile browsers may throttle transitionend while backgrounded.
          window.setTimeout(() => {
            letterPaper.removeEventListener('transitionend', onSettleEnd);
            finishSettle();
          }, 1100);
        }).catch(() => {
          fullscreenAnimating = false;
        });
      }

      // The paper is a separate interaction: tapping it must not close the envelope.
      paperSurface.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        openPaperFullscreen();
      });
      document.getElementById('letter-paper').addEventListener('click', (event) => {
        if (!control.classList.contains('is-open')) return;
        event.preventDefault();
        event.stopPropagation();
        openPaperFullscreen();
      });
      fullscreenClose.addEventListener('click', closePaperFullscreen);
      fullscreenEdit.setAttribute('aria-expanded', 'false');
      fullscreenEdit.setAttribute('aria-controls', 'paper-fullscreen-text');
      fullscreenEdit.addEventListener('click', () => {
        if (!isPaperFullscreen) return;
        const expanded = fullscreenEdit.getAttribute('aria-expanded') === 'true';
        fullscreenEdit.setAttribute('aria-expanded', String(!expanded));
        fullscreenText.classList.toggle('is-visible', !expanded);
      });
      // Touching the blank full-screen page should not dismiss it by accident.
      // Only the close control or Escape returns to the envelope.
      paperFullscreen.addEventListener('click', (event) => {
        event.stopPropagation();
      });
      window.addEventListener('resize', () => {
        if (!isPaperFullscreen || !paperLocalBox) return;
        updateFullscreenViewBox();
        const targetRect = getContainedFullscreenRect();
        if (!fullscreenAnimating) setPaperTransformForRect(targetRect);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && isPaperFullscreen) closePaperFullscreen();
      });

      control.addEventListener('click', (event) => {
        if (isPaperFullscreen) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        const isOpen = control.classList.contains('is-open');
        // With the envelope closed, only the real triangular flap opens it.
        // Keyboard activation remains available through the accessible button.
        if (!isOpen && event.detail !== 0 && !pointIsOnFlap(event)) return;

        const nextOpen = !isOpen;
        control.classList.toggle('is-open', nextOpen);
        control.setAttribute('aria-expanded', String(nextOpen));
        control.setAttribute('aria-label', nextOpen ? 'Close the red envelope' : 'Open the red envelope by lifting its flap');

        artDesc.textContent = nextOpen
          ? 'The red envelope is open, revealing a blank sheet of paper. Tap the paper to make it full screen.'
          : 'A deep red envelope. Tap its top flap to open it and reveal a completely blank sheet of paper.';
      });
    })();
  </script>
  <script src="/editor.js" defer></script>
</body>
</html>
