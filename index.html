<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0ef">
  <title>A Little Love Letter</title>
  <meta name="description" content="Open a little envelope and find a sweet love note.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #241c1d;
      --paper: #fff8f2;
      --blush: #fff0ef;
      --rose: #f4a0b3;
      --rose-deep: #dc263f;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--blush); }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 28%, rgba(255,255,255,.54), transparent 58%),
        var(--blush);
      color: var(--ink);
      font-family: "Patrick Hand", "Trebuchet MS", cursive;
    }
    main {
      width: min(100%, 850px);
      min-height: 100svh;
      padding: clamp(10px, 2.4vw, 24px) 16px 22px;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .envelope-control {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 0;
      margin: 0;
      width: 100%;
      max-width: 790px;
      display: block;
      position: relative;
      background: transparent;
      color: inherit;
      cursor: pointer;
      perspective: 1200px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      outline: none;
    }
    .envelope-control:focus-visible {
      outline: 3px solid rgba(203, 39, 62, .72);
      outline-offset: 5px;
      border-radius: 28px;
    }
    #envelope-art {
      width: 100%;
      height: auto;
      overflow: visible;
      display: block;
      filter: drop-shadow(0 9px 10px rgba(105, 43, 51, .035));
      transform: translateY(0);
      transition: transform 650ms cubic-bezier(.2,.7,.25,1);
    }
    .envelope-control:hover #envelope-art {
      transform: translateY(-3px);
    }
    .envelope-control.is-open:hover #envelope-art {
      transform: translateY(-1px);
    }
    .scene-specks {
      transform-box: fill-box;
      transform-origin: center;
      animation: speck-float 6s ease-in-out infinite alternate;
    }
    .scene-specks.delay { animation-delay: -3s; }
    .back-flap {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 50% 0%;
      transform: rotateX(0deg);
      transition:
        transform 820ms cubic-bezier(.18,.76,.23,1),
        opacity 180ms ease 160ms;
      backface-visibility: hidden;
    }
    .letter-clip { clip-path: url(#envelope-clip); }
    .envelope-control.is-open .letter-clip { clip-path: none; }
    .letter-paper {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: translateY(314px) scale(.985);
      transition: transform 920ms cubic-bezier(.18,.86,.24,1.08);
      will-change: transform;
    }
    .letter-shadow {
      opacity: .18;
      transition: opacity 500ms ease 100ms;
    }
    .closed-flap {
      opacity: 1;
      transform-box: fill-box;
      transform-origin: 50% 0%;
      transition:
        opacity 250ms ease 180ms,
        transform 650ms cubic-bezier(.25,.72,.25,1);
      backface-visibility: hidden;
    }
    .fold-strokes {
      transition: opacity 380ms ease;
    }
    .envelope-control.is-open .back-flap {
      opacity: 1;
      transform: rotateX(180deg);
      transition:
        transform 850ms cubic-bezier(.18,.76,.23,1),
        opacity 260ms ease 80ms;
    }
    .envelope-control.is-open .letter-paper {
      transform: translateY(0) scale(1);
      transition-delay: 110ms;
    }
    .envelope-control.is-open .letter-shadow { opacity: .34; }
    .envelope-control.is-open .closed-flap {
      opacity: 0;
      transform: rotateX(-18deg);
      transition-delay: 40ms, 0ms;
      pointer-events: none;
    }
    .hint {
      min-height: 28px;
      margin-top: clamp(-2px, .6vw, 8px);
      padding-inline: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #8f4c57;
      font-family: "Patrick Hand", cursive;
      font-size: clamp(14px, 2.1vw, 17px);
      letter-spacing: .11em;
      text-align: center;
      text-transform: uppercase;
      transition: color 300ms ease;
      user-select: none;
    }
    .hint-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #e35b70;
      box-shadow: 0 0 0 4px rgba(227,91,112,.10);
      animation: hint-pulse 2.2s ease-in-out infinite;
    }
    .is-open + .hint .hint-dot { animation: none; background: #bb394f; }
    @keyframes speck-float {
      from { transform: translateY(-2px); }
      to { transform: translateY(5px); }
    }
    @keyframes hint-pulse {
      0%,100% { box-shadow: 0 0 0 3px rgba(227,91,112,.09); }
      50% { box-shadow: 0 0 0 6px rgba(227,91,112,.04); }
    }
    @media (max-width: 560px) {
      main { padding: 10px 5px 18px; }
      .envelope-control { width: 100%; }
      .hint { margin-top: 3px; font-size: 13px; }
    }
    @media (max-height: 720px) and (min-width: 561px) {
      main { justify-content: flex-start; padding-top: 6px; }
      .envelope-control { max-width: min(74vh, 680px); }
      .hint { margin-top: -6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <button class="envelope-control" id="letter-control" type="button" aria-expanded="false" aria-label="Open the love letter">
      <svg id="envelope-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920" role="img" aria-labelledby="art-title art-desc">
        <title id="art-title">A little love letter</title>
        <desc id="art-desc">A red and pink envelope. Tap it to open the flap and lift a handwritten note with two hearts and a sweet message.</desc>
        <defs>
          <linearGradient id="env-body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f15b70"/>
            <stop offset=".45" stop-color="#e63850"/>
            <stop offset="1" stop-color="#ca1834"/>
          </linearGradient>
          <linearGradient id="env-left" x1="0" y1="0" x2="1" y2=".6">
            <stop offset="0" stop-color="#f9b0bf"/>
            <stop offset="1" stop-color="#ef8ca4"/>
          </linearGradient>
          <linearGradient id="env-right" x1="1" y1="0" x2="0" y2=".6">
            <stop offset="0" stop-color="#f6a4b7"/>
            <stop offset="1" stop-color="#e97994"/>
          </linearGradient>
          <linearGradient id="env-bottom" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f4a0b3"/>
            <stop offset="1" stop-color="#e9829a"/>
          </linearGradient>
          <linearGradient id="flap-top" x1="0" y1="0" x2=".25" y2="1">
            <stop offset="0" stop-color="#ee4159"/>
            <stop offset=".7" stop-color="#d7243d"/>
            <stop offset="1" stop-color="#c81732"/>
          </linearGradient>
          <linearGradient id="flap-inside" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#cf1f38"/>
            <stop offset="1" stop-color="#f26479"/>
          </linearGradient>
          <linearGradient id="paper" x1="0" y1="0" x2="1" y2=".9">
            <stop offset="0" stop-color="#fffaf5"/>
            <stop offset=".55" stop-color="#fff7f0"/>
            <stop offset="1" stop-color="#f9eee7"/>
          </linearGradient>
          <filter id="ground-shadow" x="-20%" y="-100%" width="140%" height="300%">
            <feGaussianBlur stdDeviation="10"/>
          </filter>
          <filter id="paper-shadow" x="-15%" y="-12%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#5a2029" flood-opacity=".25"/>
          </filter>
          <filter id="paper-grain">
            <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="2" seed="8" result="noise"/>
            <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
            <feComponentTransfer in="gray" result="alpha">
              <feFuncA type="table" tableValues="0 .045"/>
            </feComponentTransfer>
            <feBlend in="SourceGraphic" in2="alpha" mode="soft-light"/>
          </filter>
          <path id="heart" d="M0 12 C-4 7 -18 -1 -17 -12 C-16 -24 0 -24 3 -11 C8 -25 24 -21 24 -9 C24 2 10 12 3 20 Z"/>
          <clipPath id="envelope-clip">
            <path d="M178 425 Q178 419 188 419 L712 419 Q722 420 722 430 L722 785 Q721 796 709 797 L191 797 Q179 796 178 785Z"/>
          </clipPath>
        </defs>

        <!-- Soft, printed-looking background details; no red glow. -->
        <g fill="#eeb8c1" opacity=".26">
          <circle cx="104" cy="165" r="12"/><circle cx="192" cy="256" r="8"/>
          <circle cx="311" cy="68" r="10"/><circle cx="592" cy="55" r="12"/>
          <circle cx="758" cy="124" r="9"/><circle cx="802" cy="292" r="12"/>
          <circle cx="102" cy="505" r="9"/><circle cx="790" cy="520" r="10"/>
          <circle cx="120" cy="726" r="11"/><circle cx="776" cy="741" r="12"/>
          <circle cx="218" cy="855" r="8"/><circle cx="692" cy="868" r="10"/>
        </g>
        <g class="scene-specks delay" fill="#f3c7ce" opacity=".25">
          <circle cx="148" cy="340" r="5"/><circle cx="736" cy="365" r="6"/>
          <circle cx="352" cy="36" r="5"/><circle cx="548" cy="898" r="7"/>
        </g>

        <!-- Grounding shadow: a soft contact shadow, not a halo. -->
        <ellipse cx="450" cy="810" rx="250" ry="15" fill="#7e3542" opacity=".13" filter="url(#ground-shadow)"/>

        <!-- Envelope back and hinged rear flap. -->
        <g class="envelope-shell">
          <path d="M178 425 Q178 419 188 419 L712 419 Q722 420 722 430 L722 785 Q721 796 709 797 L191 797 Q179 796 178 785Z"
                fill="url(#env-body)" stroke="#2b2021" stroke-width="3.4" stroke-linejoin="round"/>
          <path d="M180 432 Q450 510 720 432" fill="none" stroke="#ffb4be" stroke-opacity=".42" stroke-width="2"/>
        </g>

        <g class="back-flap">
          <path d="M180 425 L720 425 L450 652Z" fill="url(#flap-inside)" stroke="#342022" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="M191 429 L450 640 L709 429" fill="none" stroke="#f67a8c" stroke-opacity=".42" stroke-width="2"/>
        </g>

        <!-- The note is clipped to the envelope while tucked inside. -->
        <g class="letter-clip" clip-path="url(#envelope-clip)">
        <g class="letter-paper">
          <path class="letter-shadow" d="M224 139 Q225 130 237 131 L662 131 Q674 132 674 144 L674 437 Q674 449 663 458 L450 625 L237 458 Q224 448 224 437Z"
                fill="#54303a" filter="url(#paper-shadow)"/>
          <path d="M224 139 Q225 130 237 131 L662 131 Q674 132 674 144 L674 437 Q674 449 663 458 L450 625 L237 458 Q224 448 224 437Z"
                fill="url(#paper)" stroke="#292122" stroke-width="3.2" stroke-linejoin="round" filter="url(#paper-grain)"/>
          <path d="M231 143 Q232 137 240 137 L657 137" fill="none" stroke="#fff" stroke-opacity=".74" stroke-width="2"/>

          <!-- Hand-drawn hearts. -->
          <g transform="translate(300 187) rotate(-12) scale(1.3)">
            <path d="M0 18 C-9 8 -31 -5 -27 -23 C-23 -42 0 -42 5 -22 C13 -44 39 -36 39 -16 C39 2 16 19 5 31Z"
                  fill="#f6a4b7" stroke="#292122" stroke-width="2.7" stroke-linejoin="round"/>
          </g>
          <g transform="translate(385 212) rotate(9) scale(.77)">
            <path d="M0 13 C-6 7 -22 -3 -19 -16 C-16 -30 1 -30 4 -15 C10 -31 29 -26 29 -11 C29 2 12 14 4 23Z"
                  fill="#f6a4b7" stroke="#292122" stroke-width="3" stroke-linejoin="round"/>
          </g>

          <g class="message" fill="#292122" text-anchor="middle" font-family="'Patrick Hand','Comic Sans MS',cursive" font-size="34" letter-spacing=".5">
            <text x="450" y="278">I will stop loving you</text>
            <text x="450" y="326">when an apple grows</text>
            <text x="450" y="374">from a mango tree on</text>
            <text x="450" y="422">the 30th of February.</text>
          </g>
          <text x="450" y="470" text-anchor="middle" fill="#423637" font-family="'Caveat','Patrick Hand',cursive" font-size="27" letter-spacing="1.1">selfcarexpress</text>
        </g>
        </g>

        <!-- Front folds overlay the lower edge of the paper, just like a real envelope. -->
        <g class="fold-strokes" clip-path="url(#envelope-clip)">
          <path d="M179 425 L450 625 L179 795Z" fill="url(#env-left)" stroke="#2b2021" stroke-width="3.3" stroke-linejoin="round"/>
          <path d="M721 425 L450 625 L721 795Z" fill="url(#env-right)" stroke="#2b2021" stroke-width="3.3" stroke-linejoin="round"/>
          <path d="M179 795 L450 625 L721 795Z" fill="url(#env-bottom)" stroke="#2b2021" stroke-width="3.3" stroke-linejoin="round"/>
          <path d="M182 788 L450 620 L718 788" fill="none" stroke="#ffe4e7" stroke-opacity=".4" stroke-width="2"/>
          <g fill="#fff6f3" stroke="#292122" stroke-width="3" stroke-linejoin="round">
            <path d="M290 668 C278 656 263 642 264 628 C266 613 286 614 294 632 C302 612 323 616 325 631 C327 646 308 663 294 677Z"/>
            <path d="M575 670 C563 657 548 643 550 629 C552 614 572 615 580 633 C588 613 609 617 611 632 C613 647 594 664 580 679Z"/>
            <path d="M434 738 C424 728 411 716 413 704 C415 691 432 692 439 708 C447 691 464 694 466 707 C468 720 452 735 440 746Z"/>
          </g>
        </g>

        <!-- Visible when closed; this fades away as the flap flips open. -->
        <g class="closed-flap">
          <path d="M180 425 L720 425 L450 650Z" fill="url(#flap-top)" stroke="#2b2021" stroke-width="3.4" stroke-linejoin="round"/>
          <path d="M190 429 L450 641 L710 429" fill="none" stroke="#ff9ba9" stroke-opacity=".46" stroke-width="2"/>
          <path d="M199 429 L450 637 L701 429" fill="none" stroke="#a9132b" stroke-opacity=".26" stroke-width="2"/>
          <g transform="translate(435 513) scale(.6)">
            <path d="M0 18 C-9 8 -31 -5 -27 -23 C-23 -42 0 -42 5 -22 C13 -44 39 -36 39 -16 C39 2 16 19 5 31Z"
                  fill="#ffe8e7" stroke="#321c21" stroke-width="3.4" stroke-linejoin="round"/>
          </g>
        </g>
      </svg>
    </button>
    <div class="hint" id="hint" aria-live="polite">
      <span class="hint-dot" aria-hidden="true"></span>
      <span id="hint-text">Tap the envelope to open</span>
    </div>
  </main>
  <script>
    (() => {
      const control = document.getElementById('letter-control');
      const hintText = document.getElementById('hint-text');
      const artDesc = document.getElementById('art-desc');

      function toggleLetter() {
        const isOpen = control.classList.toggle('is-open');
        control.setAttribute('aria-expanded', String(isOpen));
        control.setAttribute('aria-label', isOpen ? 'Close the love letter' : 'Open the love letter');
        hintText.textContent = isOpen ? 'Tap the letter to tuck it away' : 'Tap the envelope to open';
        artDesc.textContent = isOpen
          ? 'The envelope is open and the handwritten note is visible. Tap to close it.'
          : 'A red and pink envelope. Tap it to open the flap and lift a handwritten note with hearts.';
      }

      control.addEventListener('click', toggleLetter);
    })();
  </script>
</body>
</html>
